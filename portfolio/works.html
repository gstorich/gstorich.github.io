const dialog=document.querySelector('.video-dialog'),player=document.querySelector('#video-player'),videoTitle=document.querySelector('#video-title');
document.addEventListener('click',e=>{const trigger=e.target.closest('[data-video-id]');if(trigger){const id=trigger.dataset.videoId;videoTitle.textContent=trigger.getAttribute('aria-label').replace(' 영상 재생','');player.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&rel=0" title="작업 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';dialog.showModal()}if(e.target.closest('.video-close')||e.target===dialog)dialog.close()});
dialog.addEventListener('close',()=>player.innerHTML='');
const revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('shown');revealObserver.unobserve(entry.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(node=>revealObserver.observe(node));
const numberObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(!entry.isIntersecting)return;const el=entry.target,target=Number(el.dataset.count),suffix=el.dataset.suffix||'',duration=1050,start=performance.now();function tick(now){const progress=Math.min(1,(now-start)/duration),value=Math.round(target*(1-Math.pow(1-progress,3)));el.textContent=value.toLocaleString('ko-KR')+suffix;if(progress<1)requestAnimationFrame(tick)}requestAnimationFrame(tick);numberObserver.unobserve(el)}),{threshold:.6});document.querySelectorAll('[data-count]').forEach(node=>numberObserver.observe(node));
const progress=document.querySelector('.reading-progress');if(progress)window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+'%'},{passive:true});
